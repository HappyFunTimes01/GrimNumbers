; Damage-type name overrides.
;
; Names are built in, so this file is empty on purpose - the overlay already
; shows "fire", "aether", "bleeding" and so on rather than raw ids.
;
; Where those names come from: each component of a hit reaches the hook with
; the game's own CombatAttributeType value, and that enum has no
; EnumConverter specialisation in Grim Dawn's export table (see
; docs/findings.md), so it cannot be named from the binary. The built-in table
; is GDDPSMeter's, which rendered per-type damage with it against a live game.
; It is observed rather than inferred - but it was observed against an older
; build, so an id could in principle have moved since.
;
; That is what this file is for. Anything here wins over the built-in table,
; so a name that reads wrong can be corrected without a rebuild. An id with no
; entry anywhere still shows as "type N".
;
; To check an id, run  grimnumbers_client --raw  and use a skill with one known
; damage type: each event prints its split as  [fire 420]  entries. Add a line
; here, then press F10 in the app to re-read it.
;
; Format:
;
;   <id> = <name>[, RRGGBB]
;
; Ids are decimal, or hex with a 0x prefix. The colour is optional and is used
; for that element's label in the overlay. Lines starting with ; or # are
; comments.
;
; Example - rename id 7 and give it a different colour:
;
;   7 = acid, 7FBF3F
