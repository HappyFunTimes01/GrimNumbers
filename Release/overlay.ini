; Grim Numbers in-game overlay layout.
;
; Copied next to grimnumbers_app.exe by the build. Edit it and press F10 in the
; app (or in-game) to re-read it - no rebuild, no restart.
;
; The overlay is click-through: it never takes a click, a drag or the keyboard
; focus, so it cannot interrupt what you are doing. That also means it cannot
; be dragged with the mouse - position is set here.
;
; A layered window cannot draw over an exclusive-fullscreen swapchain. Run
; Grim Dawn windowed or borderless.

[overlay]
; Which corner panels are measured from, and which corner they stack away
; from: top-left, top-right, bottom-left, bottom-right.
anchor   = bottom-right
margin   = 28          ; px from the game window's edges
gap      = 8           ; px between stacked panels
padding  = 10          ; px inside a panel
width    = 320         ; default panel width
opacity  = 0.88        ; 0.15 - 1.0
font     = Consolas    ; any installed family; monospace keeps columns aligned
fontsize = 14

; Colours are RRGGBB.
bg      = 0E1014
border  = 3A4250
title   = E8C27A
label   = 9AA4B2
value   = F0F3F7
warn    = E06C5A
element = B8C0CC       ; colour for a damage type with no entry in elements.ini

; ---------------------------------------------------------------------------
; A panel is a titled box of rows. Keys apply in the order they appear, which
; is what gives the panel its vertical layout:
;
;   row       = Label | value text     right half is right-aligned
;   separator =                        a thin rule
;   elements  = N                      up to N damage types, biggest first
;   targets   = N                      up to N targets, biggest first
;
; Both halves of a row may contain {tokens}:
;
;   {dps.rolling} {dps.session} {dps.span} {window}
;   {dmg.total} {hits.total} {crit.rate} {crit.hits} {crit.damage}
;   {hit.biggest} {dtps.rolling} {taken.total} {taken.hits} {taken.ticks}
;   {taken.biggest} {drops.total} {drops.5s} {drops.60s} {drops.gaps}
;   {link} {player.name} {player.id} {game.pid}
;
; Add .s to a damage token for a compact form: {dmg.total.s} -> 1.28M
;
; Per-panel keys: title, width, dx, dy, anchor, visible.
; dx/dy shift a panel off its stacked position, so a panel can go anywhere
; without giving up the anchoring.
; ---------------------------------------------------------------------------

[panel:dps]
title = Grim Numbers
row   = DPS {window}s avg | {dps.rolling}/s
row   = DPS session {dps.span}s | {dps.session}/s
row   = Damage total | {dmg.total.s}  ({hits.total} hits)
row   = Crit rate | {crit.rate}
row   = Biggest hit | {hit.biggest.s}
separator =
row   = DTPS {window}s avg | {dtps.rolling}/s
row   = Taken total | {taken.total.s}

; Rows read "<name>  <rolling DPS>/s  <share of session total>".
[panel:elements]
title    = Elements (DPS)
elements = 6

; Off by default - turn it on when you want to see what is being hit.
[panel:targets]
title   = Targets
visible = no
targets = 5
